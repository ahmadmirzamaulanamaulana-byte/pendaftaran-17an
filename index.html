function lst(){const e=$('lst');if(!e)return;const l=fl();e.innerHTML=l.length?l.map(r=>`<div class="row" onclick="det('${r.no}')"><span><b>${esc(r.nm)}</b> <span class="mut">(${r.age} th)</span><br><span class="mut">${esc(r.cat)} · ${r.items.length} lomba · ${esc(r.no)}</span></span>${tag(r.st)}</div>`).join(''):'<p class="mut">Belum ada data.</p>'}
function det(no){const r=regs.find(x=>x.no==no);if(!r)return;const ci=cfg.cats.find(c=>c.n==r.cat);const all=new Set([...(ci?ci.i:[]),...r.items]);
$('mc').innerHTML=`<h3 style="margin:0;color:var(--r)">${esc(r.no)} ${tag(r.st)}</h3>${r.ph?`<img src="${r.ph}" alt="selfie" style="width:150px;border-radius:12px;margin:8px 0;display:block">`:'<p class="mut">Tanpa foto</p>'}
<label>Nama<input id="en" value="${esc(r.nm)}"></label><label>Umur<input id="ea" type="number" value="${r.age}"></label>
<label>Jenis kelamin<select id="eg"><option ${r.g=='Laki-laki'?'selected':''}>Laki-laki</option><option ${r.g=='Perempuan'?'selected':''}>Perempuan</option></select></label>
<label>Alamat/RT<input id="er" value="${esc(r.rt)}"></label><label>WhatsApp<input id="ew" value="${esc(r.wa)}"></label>
<label>Kategori: ${esc(r.cat)}</label><div class="chk" id="ei">${[...all].map(i=>`<label><input type="checkbox" value="${esc(i)}" ${r.items.includes(i)?'checked':''}>${esc(i)}</label>`).join('')}</div>
<p><button class="btn ok sm" onclick="setSt('${no}','diterima')">Terima</button><button class="btn d sm" onclick="setSt('${no}','ditolak')">Tolak</button><button class="btn s sm" onclick="setSt('${no}','menunggu')">Menunggu</button></p>
<button class="btn" onclick="upd('${no}')">Simpan</button><button class="btn d" onclick="del('${no}')">Hapus</button><a class="btn ok" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/62${r.wa.slice(1)}?text=${encodeURIComponent('Halo '+r.nm+', pendaftaran lomba 17 Agustus No '+r.no+' statusnya: '+r.st)}">WA Peserta</a><button class="btn s" onclick="$('md').classList.remove('on')">Tutup</button>`;$('md').classList.add('on')}
async function mut(no,fn){const r=regs.find(x=>x.no==no),o={[no]:JSON.parse(JSON.stringify(r))};fn(o,no);if(o[no])await db.doc('regs/'+no).set(o[no]);else await db.doc('regs/'+no).delete()}
async function setSt(no,st){try{await mut(no,(o,n)=>o[n].st=st);await db.doc('pub/'+no).update({st});toast('Status: '+st);$('md').classList.remove('on')}catch(x){toast('Gagal: '+(x.message||x))}}
async function upd(no){const nm=$('en').value.trim(),age=+$('ea').value,wa=normWa($('ew').value),items=[...document.querySelectorAll('#ei input:checked')].map(x=>x.value);
if(nm.length<3||!(age>0&&age<100)||!/^08\d{8,12}$/.test(wa)||!items.length)return toast('Data tidak valid.');
try{const g=$('eg').value,rt=$('er').value.trim();await mut(no,(o,n)=>Object.assign(o[n],{nm,age,g,rt,wa,items}));await db.doc('pub/'+no).update({nm:nm.split(' ')[0],w:await sha(wa)});toast('Tersimpan');$('md').classList.remove('on')}catch(x){toast('Gagal: '+(x.message||x))}}
async function del(no){if(!confirm('Hapus data peserta ini?'))return;const r=regs.find(x=>x.no==no);try{await mut(no,(o,n)=>{delete o[n]});await db.doc('pub/'+no).delete();if(r&&r.k)await db.doc('pub/'+r.k).delete();$('md').classList.remove('on');toast('Dihapus')}catch(x){toast('Gagal: '+(x.message||x))}}
async function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[['No','Nama','Umur','JK','Alamat/RT','WhatsApp','Kategori','Lomba','Status']].concat(fl().map(r=>[r.no,r.nm,r.age,r.g,r.rt,r.wa,r.cat,r.items.join('; '),r.st]));
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='peserta-lomba-17-agustus-2027.csv';a.click()}catch(x){toast('Ekspor gagal')}}
function prn(){$('pr').innerHTML=`<h2>Daftar Peserta Lomba 17 Agustus 2027 – RT 03 / RW 04 Kel. Kenanga</h2><table><tr><th>No</th><th>Nama</th><th>Umur</th><th>RT</th><th>WA</th><th>Kategori</th><th>Lomba</th><th>Status</th></tr>${fl().map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(r.nm)}</td><td>${r.age}</td><td>${esc(r.rt)}</td><td>${esc(r.wa)}</td><td>${esc(r.cat)}</td><td>${esc(r.items.join(', '))}</td><td>${r.st}</td></tr>`).join('')}</table>`;try{print()}catch(x){toast('Cetak tidak tersedia, gunakan ekspor CSV.')}}
function cfgv(){if(!admin||!ok())return go('login');D=D||JSON.parse(JSON.stringify(cfg));
$('app').innerHTML=`<div class="c"><h2>Pengaturan</h2><label><input type="checkbox" id="co" style="width:auto" ${D.open?'checked':''} onchange="D.open=this.checked"> Pendaftaran dibuka</label>
<label>Batas pendaftaran (opsional)<input type="date" value="${esc(D.dl)}" oninput="D.dl=this.value"></label>
<label>Jadwal lomba<textarea rows="2" oninput="D.sched=this.value">${esc(D.sched)}</textarea></label>
<label>Lokasi<textarea rows="2" oninput="D.loc=this.value">${esc(D.loc)}</textarea></label>
<label>Kontak panitia<textarea rows="3" oninput="D.contact=this.value">${esc(D.contact)}</textarea></label></div>
<div class="c"><h2>Kategori & Jenis Lomba</h2>${D.cats.map((c,ci)=>`<div class="c"><div class="ib"><input value="${esc(c.n)}" oninput="D.cats[${ci}].n=this.value"><button class="btn d sm" onclick="dc(${ci})">Hapus</button></div>${c.i.map((i,k)=>`<div class="ib sub"><input value="${esc(i)}" oninput="D.cats[${ci}].i[${k}]=this.value"><button class="btn d sm" onclick="di(${ci},${k})">✕</button></div>`).join('')}<button class="btn s sm" onclick="ai(${ci})">+ Jenis lomba</button></div>`).join('')}<button class="btn s" onclick="ac()">+ Kategori</button></div>
<button class="btn" onclick="svc()">Simpan Pengaturan</button><div class="c"><h3>SQL Supabase (pasang sekali)</h3><p class="mut">Supabase → SQL Editor → New query → tempel → Run. Email Anda sudah terisi otomatis.</p><textarea id="rl" rows="10" readonly>${esc(rules())}</textarea><button class="btn s sm" onclick="navigator.clipboard.writeText($('rl').value).then(()=>toast('Disalin'),()=>{$('rl').select();toast('Salin manual')})">Salin SQL</button></div>`}
const dc=i=>{if(confirm('Hapus kategori beserta jenis lombanya?')){D.cats.splice(i,1);cfgv()}},di=(c,i)=>{D.cats[c].i.splice(i,1);cfgv()},ai=c=>{D.cats[c].i.push('');cfgv()},ac=()=>{D.cats.push({n:'Kategori baru',i:[]});cfgv()};
async function svc(){D.cats=D.cats.map(c=>({n:c.n.trim(),i:c.i.map(x=>x.trim()).filter(Boolean)})).filter(c=>c.n);try{await save('cfg/main',D);cfg=JSON.parse(JSON.stringify(D));PK=1;toast('Pengaturan tersimpan');D=null;go('adm')}catch(x){toast('Gagal: '+(x.message||x))}}
(async()=>{render();
try{db=DB()}catch(x){db=null}try{await chkAdmin()}catch(x){}
if(db){db.doc('cfg/main').onSnapshot(s=>{if(s.exists)cfg={...DEF,...s.data()};if(V!='daftar'&&V!='cfg'&&V!='cek'&&V!='login')render()},()=>{});
if(admin)watch()}
route();addEventListener('hashchange',route);render()})();
</script></body></html>
